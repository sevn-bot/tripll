name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap (uv + sync)
        uses: ./.github/actions/bootstrap

      - name: Run resumable gate
        run: make ci-resume
        env:
          # Compare branch workflow pin vs Makefile during PR bumps (ADR 018 / R36).
          TRIPLL_MERGECRAFT_PARITY_REF: HEAD

  bench:
    name: Brief-packing benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap (uv + sync)
        uses: ./.github/actions/bootstrap

      - name: Run brief-packing benchmark
        run: make bench
