# mergeCraft PR review (BYOK; https://github.com/alexhawat/mergeCraft).
#
# Auto-reviews PRs on open / ready / new commits. Auth: CLAUDE_CODE_OAUTH_TOKEN
# and/or ANTHROPIC_API_KEY. Skips gracefully when neither is present (e.g. fork PRs).
# Default posture: review-only (push/shell disabled). Widen via tripll.toml [review].
#
# Trigger posture (ADR 018 / R35): keep `pull_request` (option a). GitHub does not run this
# workflow when `refs/pull/N/merge` cannot be built, so a conflicted PR would carry a
# permanently missing check that does not re-fire after the conflict is resolved. Therefore
# **`mergeCraft review` must stay non-required** in every branch ruleset until trigger posture
# is revisited (e.g. `pull_request_target` once the review becomes required).
name: mergeCraft

on:
  pull_request:
    branches: [main]  # main-only (CI-03 / ADR 018): stacked wave/* and feat/* PRs get no review
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for the agent (workflow_dispatch only)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  statuses: write
  id-token: write

concurrency:
  group: mergecraft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: mergeCraft review
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip when auth is not configured
        if: env.HAS_AUTH != 'true'
        run: |
          echo "::notice title=mergeCraft skipped::Configure CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY to enable mergeCraft reviews (fork PRs run without secrets)."

      - name: mergeCraft PR review
        if: env.HAS_AUTH == 'true'
        id: mergecraft
        continue-on-error: true
        uses: alexhawat/mergeCraft@f369164c609aa6ffb4149b0248f72f6a3e10b0a6 # main 2026-08-02 — diff-review --json
        with:
          prompt: >-
            ${{ (github.event_name == 'pull_request' && format('Review pull request #{0}. Focus on correctness, security, regressions, missing tests, and maintainability. Leave concise, actionable comments only for issues that should be addressed before merge.', github.event.pull_request.number))
                || (github.event_name == 'workflow_dispatch' && inputs.prompt != '' && inputs.prompt)
                || 'Review the current pull request.' }}
          model: anthropic/claude-sonnet
          push: disabled
          shell: disabled
          analyzers: off
          status_checks: disabled
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: mergeCraft review incomplete (non-fatal)
        if: env.HAS_AUTH == 'true' && steps.mergecraft.outcome != 'success'
        run: |
          echo "::notice title=mergeCraft incomplete::Review step did not finish successfully (see its log). Approval enforcement skipped."

      - name: Fail when mergeCraft would not approve
        if: >-
          github.event_name == 'pull_request' &&
          env.HAS_AUTH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          conclusion=""; queried=""
          for attempt in $(seq 1 5); do
            if conclusion="$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
                --jq '[.check_runs[]? | select(.name == "mergecraft-approval")]
                      | sort_by(.completed_at // .started_at) | last | .conclusion // ""')"; then
              queried="yes"; break
            fi
            echo "check-runs query failed (attempt ${attempt}/5); retrying in 5s…" >&2
            sleep 5
          done
          if [ -z "${queried}" ]; then
            echo "::warning title=mergeCraft approval unknown::Could not query check-runs for ${HEAD_SHA} after retries. Failing open."
            exit 0
          fi
          case "${conclusion}" in
            failure)
              echo "::error title=mergeCraft requested changes::mergecraft-approval check failed — address the review feedback on this PR."
              exit 1
              ;;
            success)
              echo "mergeCraft approval: no outstanding review feedback."
              ;;
            *)
              echo "::notice title=mergeCraft approval not posted::No mergecraft-approval check on ${HEAD_SHA}. Not blocking."
              ;;
          esac
