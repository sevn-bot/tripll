name: Bug report
description: Report a defect in tripll (CLI, engine, adapters, or dashboard).
title: "bug: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please do **not** report security vulnerabilities here —
        use the [Security advisories](https://github.com/sevn-bot/tripll/security/advisories)
        channel instead (see `SECURITY.md`).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
      placeholder: When I run `make run-set SET=…`, the engine …
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands, wave-plan input, or config that triggers the issue.
      placeholder: |
        1. `make setup`
        2. Drop this set under `runs/input/…`
        3. `uv run tripll run runs/input/… --dry-run`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tripll version / commit
      description: Output of `uv run tripll --version` and the commit SHA if from a clone.
      placeholder: "tripll 0.0.1 @ abc1234"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - claude_code
        - cursor_local
        - cursor_cloud
        - not applicable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version (`python --version`), uv version, backend CLI version.
      placeholder: |
        - OS: macOS 15.1
        - Python: 3.12.6
        - uv: 0.6.9
        - claude CLI: …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant output. Re-run with `TRIPLL_DEBUG=1` for verbose logs. **Redact any secrets.**
      render: shell
