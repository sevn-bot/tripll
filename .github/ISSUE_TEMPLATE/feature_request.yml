name: Feature request
description: Suggest an enhancement or new capability for tripll.
title: "feat: <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check open issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and why is it hard today?
      placeholder: As an operator, I want … so that …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, command, flag, or API you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of tripll does this touch?
      options:
        - CLI / Make targets
        - Engine / RunGraph
        - Adapters / backends
        - Control plane / dashboard (api)
        - Rules / calibration / findings
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, mockups, plan snippets, or anything else that helps.
