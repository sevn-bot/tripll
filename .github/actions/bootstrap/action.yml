name: Bootstrap
description: Install uv (pinned) and sync the tripll project (dev + api + obs extras).

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.6.9"
        python-version: "3.12"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Sync dependencies
      shell: bash
      run: uv sync --extra dev --extra api --extra obs
