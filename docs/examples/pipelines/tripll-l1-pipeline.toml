pipeline_format = 1
title = "tripll L1 pipeline"
slug = "tripll-l1"
description = "All agents, loops, and feedback paths of the L1 pipeline"

# A pipeline file names the steps of an agent pipeline — which agent, system
# phase, or human gate runs, in what order — plus the artifact state each step
# produces. Two charts are derived from this one file:
#
#   execution view — steps are nodes, `[[steps.next]]` are edges
#   state view     — `produces` states are nodes, the steps are the edges
#
# `layer` / `column` place a node on the grid (fractional columns allowed).
# Omit them for every step and placement is derived from the transitions.

# ---------------------------------------------------------------------------
# Clusters — drawn as labelled containers in either view
# ---------------------------------------------------------------------------

[[clusters]]
id = "preflight"
label = "Contract / CLI preflight — optional or on-demand"
states = ["goal", "code-kg", "spec-refs", "run-graph", "pre0"]

[[clusters]]
id = "wave-exec"
label = "Tests-first wave execution — per wave"
states = ["red-tests", "wave-commit", "quality-ok", "verdict", "integrated", "new-waves"]

[[clusters]]
id = "pr-loop"
label = "PR + compounding loop"
states = ["open-pr", "findings", "fix-commit", "ci-green", "merge", "rule-memory"]

# ---------------------------------------------------------------------------
# States — nodes of the state view
# ---------------------------------------------------------------------------

[[states]]
id = "goal"
label = "Goal / repo"
kind = "external"
note = "or error bundle"
layer = 0
column = 0

[[states]]
id = "code-kg"
label = "Code KG"
layer = 0
column = 1

[[states]]
id = "spec-refs"
label = "Spec + quality refs"
layer = 0
column = 2

[[states]]
id = "run-graph"
label = "Validated RunGraph"
layer = 0
column = 3

[[states]]
id = "pre0"
label = "Pre-0 approval"
kind = "gate"
layer = 0
column = 4

[[states]]
id = "red-tests"
label = "RED test baseline"
layer = 1
column = 0

[[states]]
id = "wave-commit"
label = "Implemented wave"
note = "commit"
layer = 1
column = 1

[[states]]
id = "quality-ok"
label = "Quality accepted"
layer = 1
column = 2

[[states]]
id = "verdict"
label = "Isolated verdict"
layer = 1
column = 3

[[states]]
id = "integrated"
label = "Integrated branch"
layer = 1
column = 4

[[states]]
id = "new-waves"
label = "New wave plan"
layer = 1
column = 5

[[states]]
id = "open-pr"
label = "Open PR"
layer = 2
column = 0

[[states]]
id = "findings"
label = "Findings"
note = "open set"
layer = 2
column = 1

[[states]]
id = "fix-commit"
label = "Fix commit"
layer = 2
column = 2

[[states]]
id = "ci-green"
label = "CI green + review clean"
layer = 2
column = 3

[[states]]
id = "merge"
label = "Human merge gate"
kind = "gate"
layer = 2
column = 4

[[states]]
id = "rule-memory"
label = "Rule / finding memory"
layer = 3
column = 4

# ---------------------------------------------------------------------------
# Steps — nodes of the execution view, edges of the state view
# ---------------------------------------------------------------------------

[[steps]]
id = "inputs"
label = "Goal / repo"
kind = "external"
note = "or error bundle"
produces = "goal"
layer = 0
column = 0
[[steps.next]]
to = "graph-extractor"
label = "repo scan"

[[steps]]
id = "graph-extractor"
cluster = "preflight"
layer = 0
column = 1
[[steps.next]]
to = "graph-librarian"

[[steps]]
id = "graph-librarian"
cluster = "preflight"
layer = 0
column = 2
[[steps.next]]
to = "graph-fuser"

[[steps]]
id = "graph-fuser"
cluster = "preflight"
produces = "code-kg"
wave = "W-KG"
layer = 0
column = 3
[[steps.next]]
to = "spec-cartographer"
label = "code KG"

[[steps]]
id = "spec-cartographer"
cluster = "preflight"
layer = 1
column = 0
[[steps.next]]
to = "reference-picker"

[[steps]]
id = "reference-picker"
cluster = "preflight"
produces = "spec-refs"
wave = "W-SPEC"
layer = 1
column = 1
[[steps.next]]
to = "plan-author"
label = "spec + refs"

[[steps]]
id = "build-plan-from-errors"
cluster = "preflight"
layer = 1
column = 2.5
[[steps.next]]
to = "plan-author"
label = "error bundle"
style = "optional"

[[steps]]
id = "wave-plan-author"
cluster = "preflight"
note = "legacy v1 / v2"
layer = 1
column = 4
[[steps.next]]
to = "plan-shape-critic"
label = "legacy plan"
style = "optional"

[[steps]]
id = "plan-author"
cluster = "preflight"
layer = 2
column = 0
[[steps.next]]
to = "plan-shape-critic"

[[steps]]
id = "plan-shape-critic"
cluster = "preflight"
produces = "run-graph"
wave = "W-PLAN"
layer = 2
column = 1
[[steps.next]]
to = "l1-validate"
label = "shape accepted"

[[steps]]
id = "l1-validate"
label = "L1 validate"
kind = "phase"
note = "plan invariants"
layer = 3
column = 0
[[steps.next]]
to = "pre0-gate"
label = "invariants hold"

[[steps]]
id = "pre0-gate"
label = "Pre-0 gate"
kind = "gate"
note = "operator decisions"
produces = "pre0"
wave = "W0"
layer = 3
column = 1.5
[[steps.next]]
to = "wave-orchestrator"
label = "approved"

[[steps]]
id = "wave-orchestrator"
note = "optional serial mode"
layer = 3
column = 3
[[steps.next]]
to = "test-creator"
label = "dispatch wave"

[[steps]]
id = "test-creator"
cluster = "wave-exec"
note = "RED baseline"
produces = "red-tests"
wave = "W1"
layer = 4
column = 0.5
[[steps.next]]
to = "implementer"
label = "RED suite"

[[steps]]
id = "implementer"
cluster = "wave-exec"
note = "wave Wi"
produces = "wave-commit"
wave = "Wi"
layer = 4
column = 2
[[steps.next]]
to = "quality-critic"
label = "wave commit"

[[steps]]
id = "quality-critic"
cluster = "wave-exec"
produces = "quality-ok"
wave = "W-Q"
layer = 4
column = 3.5
[[steps.next]]
to = "smoothing-pass"
label = "large gap"
style = "conditional"
[[steps.next]]
to = "implementer"
label = "gap → next round"
style = "conditional"
[[steps.next]]
to = "wave-verifier"
label = "quality accepted"

[[steps]]
id = "smoothing-pass"
cluster = "wave-exec"
note = "optional"
layer = 4
column = 5
[[steps.next]]
to = "quality-critic"
label = "re-grade"
style = "conditional"

[[steps]]
id = "wave-verifier"
cluster = "wave-exec"
produces = "verdict"
wave = "W-V"
layer = 5
column = 3.5
[[steps.next]]
to = "implementer"
label = "failed → retry"
style = "conditional"
[[steps.next]]
to = "test-creator"
label = "wrong test → repair"
style = "conditional"
[[steps.next]]
to = "outer-pipeline"
label = "isolated verdict"

[[steps]]
id = "outer-pipeline"
label = "Outer pipeline"
kind = "phase"
note = "verify → commit → review"
work = "integrate branch"
produces = "integrated"
wave = "W-FINAL"
layer = 6
column = 2
[[steps.next]]
to = "pr-shepherd"
label = "branch integrated"
[[steps.next]]
to = "post-review-wave-generator"
label = "changes required"
style = "conditional"

[[steps]]
id = "pr-shepherd"
cluster = "pr-loop"
produces = "open-pr"
wave = "W-REVIEW"
layer = 7
column = 0.5
[[steps.next]]
to = "ci-investigator"
label = "CI red"
style = "conditional"
[[steps.next]]
to = "review-comment-triager"
label = "review comments"
style = "conditional"

[[steps]]
id = "post-review-wave-generator"
cluster = "pr-loop"
produces = "new-waves"
wave = "W-GEN"
layer = 7
column = 3.5
[[steps.next]]
to = "outer-pipeline"
label = "new waves"
note = "next turn"
style = "conditional"
bow = "right"

[[steps]]
id = "ci-investigator"
cluster = "pr-loop"
produces = "findings"
wave = "W-CI"
layer = 8
column = 0
[[steps.next]]
to = "check-fixer"
label = "finding"
[[steps.next]]
to = "postmortem"
label = "finding"
style = "conditional"

[[steps]]
id = "review-comment-triager"
cluster = "pr-loop"
produces = "findings"
wave = "W-CI"
layer = 8
column = 1.5
[[steps.next]]
to = "review-comment-fixer"
label = "actionable"

[[steps]]
id = "check-fixer"
cluster = "pr-loop"
produces = "fix-commit"
wave = "W-CI-FIX"
layer = 9
column = 0
[[steps.next]]
to = "ci-investigator"
label = "re-verify"
style = "conditional"
[[steps.next]]
to = "verify-checks"
label = "checks fixed"

[[steps]]
id = "review-comment-fixer"
cluster = "pr-loop"
produces = "fix-commit"
wave = "W-CI-FIX"
layer = 9
column = 1.5
[[steps.next]]
to = "verify-checks"
label = "threads resolved"

[[steps]]
id = "verify-checks"
label = "CI green + review clean"
kind = "phase"
cluster = "pr-loop"
work = "poll checks"
produces = "ci-green"
wave = "re-push"
layer = 10
column = 0.75
[[steps.next]]
to = "merge-gate"
label = "gates green"

[[steps]]
id = "postmortem"
label = "Wave postmortem"
kind = "phase"
cluster = "pr-loop"
note = "finding → proposed rule"
work = "finding → proposed rule"
produces = "rule-memory"
wave = "postmortem"
layer = 9
column = 3
[[steps.next]]
to = "merge-gate"
label = "promote (R27)"
style = "conditional"
bow = "right"

[[steps]]
id = "merge-gate"
label = "Human merge gate"
kind = "gate"
note = "operator only (D15)"
work = "operator (D15)"
produces = "merge"
wave = "promote"
layer = 11
column = 1.625
