title: Architecture
nav_label: Architecture
nav_order: 30
summary: Code factory L1 — three-layer graph, task-graph execution, harness pillars, PR loop, and observability.
body: |
  <h2>Overview</h2>
  <p>tripll is a <strong>level-1 code factory</strong>: it parses wave plans into a
  <strong>RunGraph</strong>, dispatches agents in dependency order, verifies outcomes with
  isolated graders, and maintains a queryable <strong>Code KG</strong>. An optional
  <strong>PR fix loop</strong> (<code>tripll pr shepherd</code>, <code>graph</code> extra)
  pushes, opens PRs, dispatches CI/review fix agents, and stops at a <strong>human merge
  gate</strong> — it is not started automatically by <code>tripll run</code>.</p>

  <h2>Three graph layers</h2>
  <table class="table">
    <tr><th>Layer</th><th>Contents</th></tr>
    <tr><td><code>code</code></td><td>Modules, symbols, tests, specs, requirements, CI checks — extracted from the target repo</td></tr>
    <tr><td><code>task</code></td><td>Plans, waves, attempts, gates, PRs — synced alongside the ledger</td></tr>
    <tr><td><code>finding</code></td><td>CI failures and review comments ingested from GitHub</td></tr>
  </table>
  <p>Store: <code>.tripll/graph.db</code> (SQLite). Ontology:
  <code>src/tripll/ontology/ontology.yaml</code>.</p>

  <h2>RunGraph and batches</h2>
  <ul>
    <li><strong>Waves</strong> — atomic units with typed <code>depends_on</code>, owned paths, and outcome contracts.</li>
    <li><strong>Lanes</strong> — path-disjoint streams on dedicated worktrees.</li>
    <li><strong>Batches</strong> — dependency layers executed sequentially.</li>
    <li><strong>Pre-0 gate</strong> — human approval before implementation waves dispatch.</li>
  </ul>

  <h2>Harness pillars</h2>
  <ul>
    <li><strong>Env fingerprint</strong> — 13 fields per attempt for reproducibility.</li>
    <li><strong>Outcome contracts</strong> — <code>passed</code> / <code>failed</code> / <code>unverified</code>; never self-reported.</li>
    <li><strong>Verifier isolation</strong> — fresh checkout, no implementer transcript (D17).</li>
    <li><strong>Idempotency</strong> — decide/commit split; no duplicate PRs on retry.</li>
    <li><strong>Eight loop exits</strong> — turn cap (5 attempts), budget, wall clock, no-progress, circuit breaker, …</li>
  </ul>

  <h2>PR phase (opt-in)</h2>
  <p>After implementation waves, run <code>tripll pr shepherd &lt;run-id&gt;</code> (requires
  <code>graph</code> extra for the full LangGraph cycle). Flow: push branch → open PR → sync
  findings → dispatch fix agents → stop when <code>mergecraft-approval</code> and required checks
  are green → <strong>human merge gate</strong> (<code>tripll pr approve-merge</code>).
  Rejected findings export to <code>.mergecraft/learnings.md</code>. Local batch integration
  (<code>--integrate</code>) is separate and does not open PRs.</p>

  <h2>Backends and extras</h2>
  <table class="table">
    <tr><th>Extra</th><th>Purpose</th></tr>
    <tr><td><code>graph</code></td><td>LangGraph loops + durable checkpoints</td></tr>
    <tr><td><code>kg</code></td><td>NetworkX replica for analytics</td></tr>
    <tr><td><code>api</code></td><td>FastAPI control plane + dashboard</td></tr>
    <tr><td><code>obs</code></td><td>Logfire/OpenTelemetry (no-op without token)</td></tr>
  </table>
  <p><strong>No API keys required</strong> in tripll itself — auth lives in backend toolchains
  (<code>claude</code>, <code>cursor-agent</code>). Set <code>TRIPLL_REPO_ROOT</code> to point at
  the target git checkout.</p>

  <h2>Observability</h2>
  <p>SQLite ledger for run state; optional LangGraph checkpoints (derived). Dashboard panels:
  graph subgraph, findings by state, exit caps. Deep dives:
  <code>docs/design-note.md</code>, <code>docs/harness-checks.md</code>,
  <code>docs/control-plane-design.md</code>.</p>
