title: Architecture
nav_label: Architecture
nav_order: 30
summary: How tripll turns wave-plan files into a RunGraph and executes it with worktree isolation, human gates, retries, and integration.
body: |
  <h2>The RunGraph</h2>
  <p>A plan set is parsed into a <strong>RunGraph</strong> of waves. Each wave has dependencies,
  an optional review gate, owned paths, and verify targets. The graph is layered into
  <strong>batches</strong> that run in order; waves within a batch can run in parallel.</p>
  <ul>
    <li><strong>Lanes</strong> — independent streams of work, isolated by owned paths.</li>
    <li><strong>Batches</strong> — dependency layers executed sequentially.</li>
    <li><strong>Pre-0 gate</strong> — a human approval stop derived from <code>## Wave W0</code>
      sections and decision rows marked for W0.</li>
    <li><strong>CW seams</strong> — content-window hotspots forbidden to lanes that do not own them.</li>
  </ul>

  <h2>Execution engine</h2>
  <p>The engine dispatches each wave to a backend adapter inside a dedicated
  <strong>git worktree</strong>, enforces owned-path scope (reverting out-of-scope changes),
  runs verify commands, retries failures up to a limit, and escalates when exhausted. Batches can
  be <strong>integrated</strong> onto a single branch.</p>

  <h2>Backends (adapters)</h2>
  <table class="table">
    <tr><th>Adapter</th><th>Notes</th></tr>
    <tr><td><code>claude_code</code></td><td>Default; drives the <code>claude</code> CLI.</td></tr>
    <tr><td><code>cursor_local</code></td><td>Local Cursor agent dispatch.</td></tr>
    <tr><td><code>cursor_cloud</code></td><td>Optional cloud dispatch via the <code>cloud</code>
      extra; degrades gracefully when unavailable.</td></tr>
  </table>

  <h2>Tests-first model</h2>
  <p>An optional <code>role</code> column drives a tests-first flow:
  <code>W0 (gate) → W1 test-creator (full RED suite) → impl waves (green) → Final</code>. W1 is the
  single owner of <code>tests/</code>; implementation waves are forbidden from editing tests and get
  extra attempts before escalation.</p>

  <h2>State &amp; observability</h2>
  <p>Run state is tracked in a SQLite ledger with an atomic state machine. Logs go through loguru;
  optional Logfire/OpenTelemetry tracing is enabled by the <code>obs</code> extra and is a no-op
  without <code>LOGFIRE_TOKEN</code>.</p>

  <p>Deep dive: <code>docs/design-note.md</code> (graph model) and
  <code>docs/control-plane-design.md</code> (dashboard IA).</p>
