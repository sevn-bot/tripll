title: Getting started
nav_label: Getting started
nav_order: 20
summary: Install tripll, run setup and doctor, onboard a repo with init or new, then start a run — with the compounding loop available from day one.
body: |
  <h2>Why before how</h2>
  <p>tripll is not only a dispatch engine. Each run can leave behind <strong>durable rules</strong>
  (with file:line provenance), <strong>calibration</strong> against the ledger, and
  <strong>scoped context</strong> packed into the next brief. Operators activate rules; agents
  propose but never promote (R27).</p>

  <h2>New user path</h2>
  <p>tripll is <strong>not published on PyPI</strong> — there is no <code>pip install tripll</code>
  or <code>uv tool install tripll</code>. Install from a clone and drive it with
  <code>uv run tripll</code> and <code>make</code>:</p>
  <pre><code>git clone https://github.com/sevn-bot/tripll &amp;&amp; cd tripll
  make setup                              # install the CLI (uv sync) + git hooks
  uv run tripll setup                     # once per machine — providers, models, tracing
  uv run tripll doctor                    # confirm backends + layout
  export TRIPLL_REPO_ROOT=~/code/my-project   # the repo to automate
  uv run tripll init                      # brownfield (or: uv run tripll new my-project)
  uv run tripll rules derive              # optional: cited rules from evaluation
  make plan-set SET=my-set                # validate + build the RunGraph (no dispatch)
  make run-set  SET=my-set                # start the run → stops at the Pre-0 gate</code></pre>
  <p>Full walkthrough: <a href="../docs/runbooks/onboarding-runbook.md">onboarding runbook</a>
  · <a href="../docs/runbooks/rules-runbook.md">rules runbook</a> (in-repo).</p>

  <h2>What init writes</h2>
  <ul>
    <li><code>tripll.toml</code> — repo layout: <code>specs_dir</code>, <code>prds_dir</code>, <code>plans_dir</code></li>
    <li><code>docs/specs/</code>, <code>docs/prds/</code>, starter v3 wave plan</li>
    <li><code>docs/evaluation-&lt;date&gt;.md</code> — brownfield assessment with file:line evidence</li>
    <li><code>.tripll/rules/</code> — after <code>tripll rules derive</code> (proposed until promoted)</li>
    <li><code>runs/</code> — input/processing/processed/failed folders</li>
  </ul>
  <p><code>tripll init</code> is idempotent — operator-edited files are not overwritten.</p>

  <h2>Config precedence</h2>
  <ol>
    <li>CLI flags (<code>--backend</code>, <code>--model</code>, …)</li>
    <li>Environment (<code>TRIPLL_*</code>)</li>
    <li>Repo <code>tripll.toml</code></li>
    <li>Machine <code>~/.config/tripll/config.toml</code> (from <code>tripll setup</code>)</li>
  </ol>
  <p>tripll <strong>never stores provider credentials</strong> in config files (R24).</p>

  <h2>tripll checkout (contributors)</h2>
  <pre><code>git clone https://github.com/sevn-bot/tripll
  cd tripll
  make setup      # uv sync (dev/api/obs) + git hooks
  make init       # creates runs/{input,processing,processed,failed}/</code></pre>

  <h2>First run (operator quick path)</h2>
  <pre><code># Drop ONE input set under runs/input/&lt;name&gt;/ then:
  make plan-set SET=my-set     # parse + validate the graph (no dispatch)
  make run-set  SET=my-set     # start the run → stops at the Pre-0 gate

  # Resolve the Pre-0 gate, then continue:
  make finish-pre0 RUN=&lt;run-id&gt;

  # Inspect progress at any time:
  make status RUN=&lt;run-id&gt;</code></pre>

  <h2>Input shapes</h2>
  <p>tripll always takes a <strong>directory</strong> under <code>runs/input/&lt;name&gt;/</code>
  and auto-detects the mode:</p>
  <table class="table">
    <tr><th>Mode</th><th>Use</th></tr>
    <tr><td><strong>A — parallel-wave set</strong></td><td>A coordinated multi-plan manifest
      (<code>parallel-wave.md</code> + one <code>*-wave-plan.md</code> per row).</td></tr>
    <tr><td><strong>B-v1 — execution graph</strong></td><td>A single wave-plan with a
      <code>## tripll execution graph</code> table (recommended).</td></tr>
    <tr><td><strong>B-legacy — plain wave files</strong></td><td>Files clustered into lanes by
      path overlap only.</td></tr>
  </table>

  <p>See <a href="cli.html">CLI &amp; Make</a> for the full command set, and the in-repo
  <code>docs/runbooks/operator-runbook.md</code> for day-to-day operations.</p>
