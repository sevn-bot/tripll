title: Getting started
nav_label: Getting started
nav_order: 20
summary: Install tripll, initialize the runs directory, drop in a plan set, and start a run that stops at the Pre-0 human gate.
body: |
  <h2>Prerequisites</h2>
  <ul>
    <li><strong>uv</strong> — installs the <code>tripll</code> CLI into the project env.</li>
    <li><strong>A backend</strong> — the default <code>claude_code</code> needs <code>claude</code>
      on <code>PATH</code>. tripll holds <strong>no API keys</strong>; auth lives in the backend
      toolchain.</li>
    <li><strong>A target repo</strong> — the git checkout tripll orchestrates. Point at it with
      <code>TRIPLL_REPO_ROOT</code>, or run from inside it.</li>
  </ul>

  <h2>Install</h2>
  <pre><code>git clone https://github.com/sevn-bot/tripll
  cd tripll
  make setup      # uv sync (dev/api/obs) + git hooks
  make init       # creates runs/{input,processing,processed,failed}/</code></pre>

  <h2>First run</h2>
  <pre><code># Drop ONE input set under runs/input/&lt;name&gt;/ then:
  make plan-set SET=my-set     # parse + validate the graph (no dispatch)
  make run-set  SET=my-set     # start the run → stops at the Pre-0 gate

  # Resolve the Pre-0 gate, then continue:
  make finish-pre0 RUN=&lt;run-id&gt;

  # Inspect progress at any time:
  make status RUN=&lt;run-id&gt;</code></pre>

  <h2>Input shapes</h2>
  <p>tripll always takes a <strong>directory</strong> under <code>runs/input/&lt;name&gt;/</code>
  and auto-detects the mode:</p>
  <table class="table">
    <tr><th>Mode</th><th>Use</th></tr>
    <tr><td><strong>A — parallel-wave set</strong></td><td>A coordinated multi-plan manifest
      (<code>parallel-wave.md</code> + one <code>*-wave-plan.md</code> per row).</td></tr>
    <tr><td><strong>B-v1 — execution graph</strong></td><td>A single wave-plan with a
      <code>## tripll execution graph</code> table (recommended).</td></tr>
    <tr><td><strong>B-legacy — plain wave files</strong></td><td>Files clustered into lanes by
      path overlap only.</td></tr>
  </table>

  <p>See <a href="cli.html">CLI &amp; Make</a> for the full command set, and the in-repo
  <code>docs/runbooks/operator-runbook.md</code> for day-to-day operations.</p>
